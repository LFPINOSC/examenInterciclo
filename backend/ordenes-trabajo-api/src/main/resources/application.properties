spring.application.name=ordenes-trabajo-api

# ---- Conexion a PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ordenes_trabajo}
spring.datasource.username=${DB_USUARIO:kotaro}
spring.datasource.password=${DB_PASSWORD:kotaro}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# update: Hibernate crea o actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080

# ---- Front-end Angular ----
# Origenes que pueden llamar a la API desde el navegador (separados por coma)
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

# ---- Seguridad: JWT ----
# Clave HMAC-SHA256 en Base64 (minimo 256 bits). En produccion se lee de una variable de entorno.
app.jwt.secreto=${JWT_SECRETO:b3JkZW5lcy10cmFiYWpvLWV4YW1lbi1pbnRlcmNpY2xvLXVjYWN1ZS1jbGF2ZS1zZWNyZXRhLWp3dC0yMDI2IQ==}
# Duracion del token en minutos
app.jwt.expiracion-minutos=480

# ---- Seguridad: bloqueo por intentos fallidos ----
app.login.max-intentos=5

# ---- Administrador inicial (se crea al arrancar si no existe) ----
app.admin.username=admin
app.admin.correo=admin@ordenes.com
app.admin.password=${ADMIN_PASSWORD:Admin123*}
