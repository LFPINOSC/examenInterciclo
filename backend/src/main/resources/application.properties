# ======================================
# SISTEMA DE GESTION ODONTOLOGICA
# CONFIGURACION DEL BACKEND
# ======================================

# Nombre de la aplicacion
spring.application.name=odontologia-api

# Puerto del servidor
server.port=8080

# ======================================
# CONEXION A POSTGRESQL
# ======================================

spring.datasource.url=jdbc:postgresql://localhost:5432/odontologia_db
spring.datasource.username=postgres
spring.datasource.password=${12345}

# ======================================
# CONFIGURACION DE JPA / HIBERNATE
# ======================================

# Validar las tablas existentes
spring.jpa.hibernate.ddl-auto=validate

# Mostrar consultas SQL
spring.jpa.show-sql=true

# Desactivar Open Session in View
spring.jpa.open-in-view=false

# =========================================
# SEGURIDAD JWT
# =========================================

# Clave privada cargada desde Windows
app.jwt.secret-base64=${JWT_SECRET_BASE64}