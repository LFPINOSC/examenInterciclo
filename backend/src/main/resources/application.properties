# =====================================================
# SISTEMA DE GESTION DE MATRICULAS UNIVERSITARIAS
# Configuracion de PostgreSQL y JPA
# =====================================================

spring.application.name=matriculas

# Conexion con PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/matriculas_db
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del backend
server.port=8080
# =====================================================
# CONFIGURACION ADICIONAL JPA
# =====================================================

# Evita consultas automaticas fuera de la capa correspondiente
spring.jpa.open-in-view=false


# =====================================================
# CONFIGURACION JWT
# =====================================================

# Clave utilizada para firmar los tokens JWT
app.jwt.secret=bWF0cmljdWxhcy11bml2ZXJzaXRhcmlhcy1leGFtZW4tMjAyNi1jbGF2ZS1qd3Q=

# Duracion del token: 8 horas
app.jwt.expiration=28800000