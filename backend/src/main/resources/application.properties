spring.application.name=inventario-comercial
server.port=8080

# ---------- Base de datos PostgreSQL ----------
# La base "inventario_comercial" debe existir (créala en pgAdmin).
# Cambia usuario y contraseña segun tu PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5433/inventario_comercial
spring.datasource.username=postgres
# La contraseña real va en application-local.properties (no se sube a GitHub)
spring.datasource.password=${DB_PASSWORD:postgres}
spring.config.import=optional:classpath:application-local.properties

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guayaquil

# ---------- JWT ----------
# Clave de al menos 32 caracteres (256 bits) para HS256
app.jwt.secret=ExamenInterciclo2026-InventarioComercial-KevinMarca-ClaveSegura
app.jwt.expiracion-ms=28800000
