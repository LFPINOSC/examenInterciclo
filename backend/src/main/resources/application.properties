spring.application.name=inventario-comercial
server.port=8080

# ---------- Base de datos MySQL ----------
# Cambia usuario y contraseña segun tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_comercial?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# Clave de al menos 32 caracteres (256 bits) para HS256
app.jwt.secret=ExamenInterciclo2026-InventarioComercial-KevinMarca-ClaveSegura
app.jwt.expiracion-ms=28800000
