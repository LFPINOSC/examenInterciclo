spring.application.name=reservas-hoteleras
server.port=8083
spring.config.import=optional:file:./configuracion-local/application-local.properties,optional:file:../configuracion-local/application-local.properties
spring.datasource.url=jdbc:mariadb://localhost:3306/reservas_hoteleras_db
spring.datasource.username=reservas_app
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
app.jwt-secret=${JWT_SECRET:}
app.admin-email=${ADMIN_EMAIL:admin@reservas.local}
app.admin-password=${ADMIN_PASSWORD:}
app.cors-origins=http://localhost:4201,http://127.0.0.1:4201
server.error.include-message=never
