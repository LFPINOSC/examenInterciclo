spring.application.name=tecnosoporte
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soporte_tecnico_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=7200000
app.admin.email=${ADMIN_EMAIL:admin@tecnosoporte.local}
app.admin.password=${ADMIN_PASSWORD:}
app.demo.seed=${APP_DEMO_SEED:true}
app.demo.client-password=${DEMO_CLIENT_PASSWORD:}
springdoc.swagger-ui.path=/swagger-ui.html
