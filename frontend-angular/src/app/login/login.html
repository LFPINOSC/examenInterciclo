<div style="font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px;">
        <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Laboratorio Clínico (Angular)</h2>
        
        <form (ngSubmit)="onLogin()">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #666;">Correo Electrónico:</label>
                <input type="email" [(ngModel)]="email" name="email" required placeholder="admin@laboratorio.com" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; color: #666;">Contraseña:</label>
                <input type="password" [(ngModel)]="password" name="password" required placeholder="******" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; border: none; border-radius: 4px; color: white; font-size: 16px; cursor: pointer; margin-top: 10px;">Ingresar</button>
        </form>
        
        <div *ngIf="mensaje" [ngStyle]="{'color': esError ? '#dc3545' : '#28a745'}" style="margin-top: 15px; text-align: center; font-size: 14px;">
            {{ mensaje }}
        </div>
    </div>
</div>
