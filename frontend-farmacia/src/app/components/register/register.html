<div class="register-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h2>Registro de Cliente</h2>
  
  <form (ngSubmit)="onRegister()">
    <div style="margin-bottom: 15px;">
      <label>Correo / Usuario:</label><br>
      <input type="text" [(ngModel)]="username" name="username" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <div style="margin-bottom: 15px;">
      <label>Contraseña:</label><br>
      <input type="password" [(ngModel)]="password" name="password" required style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;">
    </div>

    <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">Registrarse</button>
  </form>

  <p *ngIf="successMessage" style="color: green; margin-top: 10px;">{{ successMessage }}</p>
  <p *ngIf="errorMessage" style="color: red; margin-top: 10px;">{{ errorMessage }}</p>

  <p style="margin-top: 15px; text-align: center;">
    ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a>
  </p>
</div>
