<div style="max-width: 900px; margin: 40px auto; padding: 30px; font-family: sans-serif; background-color: #f8f9fa; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
  <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dee2e6; padding-bottom: 15px; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0; color: #dc3545;">🛡️ Panel de Administración</h2>
      <p style="margin: 5px 0 0; color: #6c757d;">Gestión total del sistema de farmacia</p>
    </div>
    <button (click)="logout()" style="padding: 10px 15px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Cerrar Sesión
    </button>
  </header>

  <section style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
    <div style="background: white; padding: 20px; border-radius: 6px; border: 1px solid #ced4da;">
      <h3>Gestión de Usuarios</h3>
      <p>Aquí puedes ver los usuarios registrados y cambiar sus roles.</p>
    </div>
    <div style="background: white; padding: 20px; border-radius: 6px; border: 1px solid #ced4da;">
      <h3>Inventario de Medicamentos</h3>
      <p>Control de stock, precios y productos de la farmacia.</p>
    </div>
  </section>
</div>
