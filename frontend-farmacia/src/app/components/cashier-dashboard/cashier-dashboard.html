<div style="max-width: 900px; margin: 40px auto; padding: 30px; font-family: sans-serif; background-color: #f8f9fa; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
  <header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dee2e6; padding-bottom: 15px; margin-bottom: 20px;">
    <div>
      <h2 style="margin: 0; color: #ffc107;">💰 Panel de Cajero</h2>
      <p style="margin: 5px 0 0; color: #6c757d;">Control de cobros y facturación de ventas</p>
    </div>
    <button (click)="logout()" style="padding: 10px 15px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
      Cerrar Sesión
    </button>
  </header>
  <section style="background: white; padding: 20px; border-radius: 6px; border: 1px solid #ced4da;">
    <h3>Caja y Facturación</h3>
    <p>Procesa los pagos de los clientes y emite los comprobantes de venta.</p>
  </section>
</div>
