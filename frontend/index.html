<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control de Órdenes de Trabajo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="login-view" class="login">
    <form id="login-form" class="card" novalidate>
      <h1>Órdenes de Trabajo</h1>
      <label>Email <input type="email" name="email" required autocomplete="username"></label>
      <label>Contraseña <input type="password" name="password" required autocomplete="current-password"></label>
      <p class="error" id="login-error"></p>
      <button type="submit">Ingresar</button>
    </form>
  </section>

  <!-- APP -->
  <div id="app-view" hidden>
    <header>
      <strong>Órdenes de Trabajo</strong>
      <nav id="nav"></nav>
      <span id="user-info"></span>
      <button id="logout" class="secondary">Salir</button>
    </header>
    <main id="main"></main>
  </div>

  <!-- MODAL genérico -->
  <dialog id="modal">
    <form method="dialog" id="modal-form" novalidate>
      <h2 id="modal-title"></h2>
      <div id="modal-fields"></div>
      <p class="error" id="modal-error"></p>
      <div class="actions">
        <button type="button" class="secondary" id="modal-cancel">Cancelar</button>
        <button type="submit">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
